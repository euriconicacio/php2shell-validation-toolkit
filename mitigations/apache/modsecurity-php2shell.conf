# PHP2Shell interim ModSecurity rules (CVE-2026-109618 / CVE-2026-109619).
# STOPGAP only. Patch PHP to 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12.
#
# Requires ModSecurity with request body access on.
SecRequestBodyAccess On

# Block the session upload-progress field anywhere in the body
# (the session case of CVE-2026-109619).
SecRule REQUEST_BODY|ARGS_NAMES|ARGS "@rx (?i)PHP_SESSION_UPLOAD_PROGRESS" \
    "id:2026109618,phase:2,deny,status:403,log,\
     msg:'PHP2Shell: session upload-progress field blocked (CVE-2026-109619)'"

# Optional: reject multipart bodies ModSecurity's parser considers malformed.
# General hardening for the multipart routes into CVE-2026-109618; it will not
# catch every out-of-memory route. Tune to your traffic before use.
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:2026109619,phase:2,deny,status:403,log,\
     msg:'PHP2Shell: malformed/suspicious multipart upload blocked'"
