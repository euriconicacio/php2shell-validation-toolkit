# PHP2Shell interim lighttpd mitigation (CVE-2026-109618 / CVE-2026-109619).
# Denies multipart uploads on write methods. STOPGAP only — patch PHP.
#
# Include from lighttpd.conf:  include "php2shell.conf"

$HTTP["request-method"] =~ "^(POST|PUT|PATCH)$" {
    $HTTP["content-type"] =~ "multipart/form-data" {
        url.access-deny = ( "" )
    }
}
