# PHP2Shell interim nginx mitigation (CVE-2026-109618 / CVE-2026-109619).
# STOPGAP, not a fix. Patch PHP to 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12.
#
# Include the relevant block inside server { } (or location { }).

# --- Option A: block multipart uploads (header-based, cheap) ----------------
# Breaks file uploads and some checkout/upload forms. Scope to routes that
# never need uploads, or exclude your upload endpoints.
if ($http_content_type ~* "multipart/form-data") {
    return 403;
}

# --- Option B: block the trigger field in the body (needs body buffering) ---
# More precise; requires the body to be read/buffered.
# if ($request_body ~* "PHP_SESSION_UPLOAD_PROGRESS") {
#     return 403;
# }

# --- Option C: emergency read-only mode -------------------------------------
# Reject anything that can carry a request body while you patch.
# if ($request_method !~ ^(GET|HEAD)$) {
#     return 503;
# }

# For large-scale or precise filtering prefer a real WAF (ModSecurity) or an
# edge WAF (see cloudflare/README.md). Remove these rules once PHP is patched.
