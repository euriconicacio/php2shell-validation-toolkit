; PHP2Shell interim hardening (CVE-2026-109618 / CVE-2026-109619)
; STOPGAP. The only complete fix is upgrading PHP to:
;   8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 (or a later release on that branch).
;
; Place these in php.ini or the active FPM pool config. Do NOT rely on
; .user.ini or ini_set() for session.upload_progress.* — they are applied
; too late relative to when the request body is parsed.

; --- Primary mitigation -----------------------------------------------------
; Disable the session upload-progress handler (feeds the CVE-2026-109618 path).
; Public advisories note this alone is NOT sufficient; combine with WAF rules
; and patch as soon as possible.
session.upload_progress.enabled = 0

; In a PHP-FPM pool, prefer the admin flag so apps cannot re-enable it:
;   php_admin_flag[session.upload_progress.enabled] = off

; Belt-and-suspenders: trigger name and cleanup knobs.
session.upload_progress.cleanup = 1
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"

; --- Error exposure ---------------------------------------------------------
; Keep fatal-error backtraces (relevant to CVE-2026-109619) away from clients.
display_errors = Off
log_errors = On

; --- memory_limit (DANGEROUS knob — read before using) ----------------------
; Some advisories mention raising/removing the memory cap because the use-
; after-free is triggered by an out-of-memory fatal error. Setting
; memory_limit = -1 lets a SINGLE request exhaust all server RAM and is a
; denial-of-service risk on its own. Do NOT set this blindly.
;
; If you choose to use it as a very short-term measure, monitor memory closely
; and restore a sane limit the moment PHP is patched:
; memory_limit = -1
