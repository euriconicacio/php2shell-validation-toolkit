; PHP2Shell interim hardening (CVE-2026-109618 / CVE-2026-109619)
; STOPGAP. The only complete fix is upgrading PHP to:
;   8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 (or a later release on that branch),
; or installing your distribution's patched package.
;
; Each setting below removes one known route; PHP says none is a complete
; mitigation. Set them administratively, in php.ini or the active FPM pool
; (php_admin_value / php_admin_flag), so applications cannot override them.
; Do NOT rely on .user.ini or ini_set(): they are applied too late. Restart
; EVERY PHP worker afterwards.

; --- CVE-2026-109619, session upload-progress case ---------------------------
; Stops the demonstrated early session producer/consumer. Few applications use
; upload progress bars; PHP suggests keeping it off even after patching.
session.upload_progress.enabled = 0

; In a PHP-FPM pool, prefer the admin flag so apps cannot re-enable it:
;   php_admin_flag[session.upload_progress.enabled] = off

; --- CVE-2026-109619, PHP 8.5 fatal-error backtrace case ---------------------
; PHP 8.5 only (on by default there). Removes the producer behind the confirmed
; RCE. The cost is losing backtraces in fatal-error logs.
; fatal_error_backtraces = 0

; NOTE: display_errors, log_errors, error_reporting and @ do NOT protect
; against CVE-2026-109619: the stale state is read before PHP decides whether
; to report a warning. Keep display_errors = Off for the usual reasons only.

; --- CVE-2026-109618, controllable out-of-memory -----------------------------
; PHP's primary configuration stopgap: removes the predictable per-request
; limit the confirmed exploit relies on. NOT complete: if mmap() or another
; underlying allocation fails, PHP can still take the vulnerable longjmp() path.
; COST: a single request can now exhaust all server RAM (denial of service).
; If you enable it, put a container / cgroup memory limit (memory.max) in its
; place, and restore a finite memory_limit as soon as PHP is patched.
; Do NOT use RLIMIT_AS / RLIMIT_DATA instead: they make allocations fail and
; trigger the very longjmp() path the bug relies on.
; memory_limit = -1

; Keep request size and shape bounded (reduces both exploitation routes and DoS
; risk; enforce the decoded body size at the front end too):
;   post_max_size, max_input_vars, max_input_nesting_level, max_file_uploads
